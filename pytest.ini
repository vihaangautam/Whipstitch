[pytest]
asyncio_mode = strict

# One event loop for the whole run. app/db/session.py builds its async engine at import
# time, so its asyncpg connection pool binds to whichever loop first touched it — a
# per-test loop makes every later test fail with "'NoneType' object has no attribute
# 'send'" when it picks up a connection from a dead loop. Production runs a single loop,
# so this matches how the app actually behaves.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
