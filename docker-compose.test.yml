services:
  postgres-test:
    image: postgres:15-alpine
    container_name: whipstitch_postgres_test
    environment:
      POSTGRES_DB: whipstitch_test_db
      POSTGRES_USER: whipstitch_test_user
      POSTGRES_PASSWORD: whipstitch_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whipstitch_test_user -d whipstitch_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: whipstitch_redis_test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
