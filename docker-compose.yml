services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whipstitch_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://whipstitch_user:whipstitch_password@postgres:5432/whipstitch_db
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whipstitch_worker
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://whipstitch_user:whipstitch_password@postgres:5432/whipstitch_db
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      fastapi-app:
        condition: service_started
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: whipstitch_postgres
    environment:
      POSTGRES_DB: whipstitch_db
      POSTGRES_USER: whipstitch_user
      POSTGRES_PASSWORD: whipstitch_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whipstitch_user -d whipstitch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whipstitch_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: whipstitch_temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=whipstitch_user
      - POSTGRES_PWD=whipstitch_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
