name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_KEY: whipstitch-dev-key-12345
  JWT_SECRET_KEY: ci-test-secret-not-a-real-key
  ENCRYPTION_MASTER_KEY: ci-test-master-key
  ENVIRONMENT: test
  MOCK_APOLLO: "true"

jobs:
  # The app is built to run without Postgres, Redis or Temporal — SQLite fallback,
  # process-local idempotency locks, inline workflow execution. That degraded mode is what
  # a fresh clone and a cold deploy actually hit, so it gets its own job pointed at
  # unreachable hosts. If graceful degradation regresses, this goes red.
  backend-degraded:
    name: Backend tests (no Postgres/Redis)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/unreachable
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit -q

  # SQLite does not enforce foreign keys or column types the way Postgres does, so the
  # degraded job above can stay green while production is broken — that is exactly how an
  # orphaned-tenant write survived review. This job runs the same suite against the real
  # engine, after applying every migration to a real database.
  backend-postgres:
    name: Backend tests (Postgres + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whipstitch
          POSTGRES_PASSWORD: whipstitch
          POSTGRES_DB: whipstitch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://whipstitch:whipstitch@127.0.0.1:5432/whipstitch_ci
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Migrations apply to a real Postgres
        run: alembic upgrade head

      - name: Exactly one migration head
        run: |
          heads=$(alembic heads | grep -c "(head)")
          test "$heads" -eq 1 || { echo "expected 1 head, found $heads"; exit 1; }

      - run: python -m pytest tests/unit -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
